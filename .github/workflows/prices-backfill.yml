# Old Back · rebuilds the price history from TCGCSV's daily archives (since
# 2024-02-08): every day of the last 45 and one day per week before that.
# Run it from the Actions tab → «Historial de precios (relleno)» → «Run workflow».
name: Historial de precios (relleno)
on:
  workflow_dispatch:
    inputs:
      days:
        description: Días hacia atrás
        default: '365'
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 7-Zip
        run: command -v 7z || (sudo apt-get update && sudo apt-get install -y p7zip-full)
      - name: Rellenar historial
        run: node prices/history.mjs backfill "${{ inputs.days }}"
      - name: Guardar
        run: |
          git config user.name "oldback-precios"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices/history.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          trap 'echo "::error::Fallo al guardar: $(git status --short | head -5 | tr "\n" " ") $(git log --oneline -1)"' ERR
          git commit -m "Historial de precios $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
