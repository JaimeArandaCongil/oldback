# Old Back · daily prices for the GitHub edition.
# TCGCSV publishes the TCGplayer table around 20:00 UTC; the second run retries
# whatever failed. «Run workflow» in the Actions tab refreshes on demand.
name: Precios TCGplayer
on:
  schedule:
    - cron: '35 21 * * *'
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar precios
        run: node prices/refresh.mjs
      - name: Guardar si han cambiado
        run: |
          git config user.name "oldback-precios"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices/references.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Precios TCGplayer $(date -u +%F)"
          git pull --rebase
          git push
