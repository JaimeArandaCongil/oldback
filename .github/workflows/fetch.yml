# Temporary: downloads the public card data listed in fetch/request.json
# (the app's cloud container cannot reach these sites). Branch only.
name: Datos de sets (temporal)
on:
  push:
    branches: [claude-fetch]
    paths: ['fetch/request.json']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch/run.mjs
      - run: |
          git config user.name "oldback-datos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fetch/out
          git commit -m "Datos descargados $(date -u +%FT%TZ)" || exit 0
          git pull --rebase origin claude-fetch
          git push origin HEAD:claude-fetch
